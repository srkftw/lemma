  kernel-architecture-rv64:
    name: Task 003 architectural containment RV64 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare architectural test log directory
        run: mkdir -p build/ci

      - name: Build, audit and observe exact architectural cases at O0 and O2
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 40m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_kernel_architecture.py \
                --work-dir build/kernel/ci-architecture --clean \
                --timeout 300 --deadline 2400 \
            2>&1 | tee build/ci/kernel-architecture-rv64.log

      - name: Require all actual architectural faults and continuing services
        run: |
          set -euo pipefail
          nix develop --no-write-lock-file --command python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from check_kernel_architecture import validate_architecture
          value = validate_architecture(Path("build/kernel/ci-architecture/result.json"), Path.cwd())
          if value["status"] != "PASS" or len(value["cases"]) != 12:
              raise RuntimeError("Missing mandatory architectural containment evidence")
          PY

      - name: Retain architectural containment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-architecture-rv64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/source.json
            build/kernel/ci-architecture/
            build/ci/kernel-architecture-rv64.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  silicon-devices-rtl:
    name: RTL device and digital power conformance with literal host stimuli
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare RTL device logs
        run: mkdir -p build/ci

      - name: Build and execute real RTL device bus checks
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            python3 scripts/check_silicon.py --lane devices \
              --work-dir build/silicon/ci-devices --timeout 600 --jobs 2 \
            2>&1 | tee build/ci/silicon-devices-rtl.log

      - name: Check actual core store lanes and shared DMA memory beats
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            python3 scripts/check_silicon.py --lane bus-lanes \
              --work-dir build/silicon/ci-bus-lanes --timeout 500 --jobs 2 \
            2>&1 | tee build/ci/silicon-bus-lanes-rtl.log

      - name: Execute versioned digital power controller boundaries
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 5m \
            python3 scripts/check_silicon.py --lane power \
              --work-dir build/silicon/ci-power --timeout 240 --jobs 2 \
            2>&1 | tee build/ci/silicon-power-rtl.log

      - name: Preserve UART admission and exact suffix across pen resynchronization
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 16m \
            python3 scripts/silicon_compute.py build \
              --profile lemma-silicon-dev/0.10.0 --jobs 2 \
              --output-dir build/silicon/ci-product-reset-runtime \
            2>&1 | tee build/ci/silicon-reset-runtime-build.log
          timeout --foreground --signal=TERM --kill-after=10s 3m \
            nix-shell tooling/silicon/sim.nix --run \
              'python3 scripts/check_native_pen_uart_resync.py --rtl-build build/silicon/ci-product-reset-runtime --work-dir build/silicon/ci-pen-uart-resync' \
            2>&1 | tee build/ci/silicon-pen-uart-resync.log

      - name: Require exact-source nonempty literal RTL observations
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          value = json.loads(Path('build/silicon/ci-devices/result.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = ['PEN stable-head overflow exact-ack resync watchdog reset PASS',
                      'PAPER banked aperture 32 lane-width cases and 4 boundary rejections PASS',
                      'PAPER latch Busy invalid-command bounds interrupted-reset PASS',
                      'BLOCK descriptors DMA payload used-ring flush error bounds reset PASS',
                      'RAM 4096-byte register implementation distinct sparse windows strobes faults PASS',
                      'BLOCK-PROTOCOL DMA/media backpressure reset/error quiescence queue stability PASS',
                      'BLOCK-PROTOCOL simultaneous completion/error IRQ ACK event precedence PASS',
                      'BLOCK-PROTOCOL normal flush and 12 independent cases PASS',
                      'PEN-BANKS full-capacity all-fields two-wrap and ingress bypass PASS',
                      'PEN-BANKS refill backpressure reset cancellation and watchdog head PASS',
                      'PAPER-SEQUENCER immutable 3-phase row/source clocks backpressure powerdown PASS',
                      'PAPER-SEQUENCER invalid mode reset retained panel and scan error abort PASS']
          inputs = {'sim/rtl/lemma_pen.sv', 'sim/rtl/lemma_paper.sv', 'sim/rtl/lemma_block.sv',
                    'sim/rtl/lemma_register_ram.sv', 'conformance/silicon/Devices.sv',
                    'conformance/silicon/BlockProtocol.sv',
                    'conformance/silicon/PenBanks.sv', 'conformance/silicon/PaperSequencer.sv',
                    'scripts/check_silicon.py', 'tooling/silicon/sim.nix', 'flake.lock'}
          if value['status'] != 'PASS' or value['lane'] != 'devices' or value['source_commit'] != head:
              raise RuntimeError('Missing exact-candidate RTL device result')
          if value['observations'] != expected or set(value['source_inputs']) != inputs or len(value['commands']) != 8:
              raise RuntimeError('Missing independent literal bus observations')
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise RuntimeError('RTL device source checkout changed')
          for path, digest in value['source_inputs'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('RTL device input changed')
          for command in value['commands']:
              log = Path(command['log'])
              if command['exit_code'] != 0 or not log.stat().st_size or hashlib.sha256(log.read_bytes()).hexdigest() != command['log_sha256']:
                  raise RuntimeError('Missing or changed actual RTL command output')
          if set(value['tool_inputs']) != {'verilator', 'verilator_bin', 'make', 'c++'} or len(value['compiled_binaries']) != 4:
              raise RuntimeError('Missing actual RTL host-tool or compiled-binary identities')
          for tool in value['tool_inputs'].values():
              if not tool['path'].startswith('/nix/store/') or not tool['version'] or hashlib.sha256(Path(tool['path']).read_bytes()).hexdigest() != tool['sha256']:
                  raise RuntimeError('RTL host executable changed')
          for path, digest in value['compiled_binaries'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('RTL simulation binary changed')
          for index, top in ((0, 'Devices'), (2, 'BlockProtocol'), (4, 'PenBanks'), (6, 'PaperSequencer')):
              if value['commands'][index]['effective_argv'][:8] != ['verilator', '--binary', '--timing', '-j', '2', '-Wno-fatal', '--top-module', top]:
                  raise RuntimeError('Missing actual bounded RTL compile invocation')
          power = json.loads(Path('build/silicon/ci-power/result.json').read_text())
          if power['status'] != 'PASS' or power['lane'] != 'power' or power['source_commit'] != head:
              raise RuntimeError('Missing exact-candidate power controller execution')
          if power['observations'] != [
                  'POWER six independent BUSY sources malformed MMIO no false completion PASS',
                  'POWER raw edge guest decision exact cancel wake and W1C precedence PASS',
                  'POWER warm held-button epoch retention and cold control reset PASS']:
              raise RuntimeError('Missing independent power transitions')
          if set(power['source_inputs']) != {
                  'sim/rtl/lemma_power.sv', 'conformance/silicon/PowerControl.sv',
                  'sim/profiles/lemma-silicon-dev-0.3.0.json', 'scripts/silicon_profile.py',
                  'scripts/check_silicon.py', 'tooling/silicon/sim.nix', 'flake.lock'}:
              raise RuntimeError('Missing power input closure')
          for path, digest in power['source_inputs'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Power controller source changed')
          if len(power['commands']) != 2 or any(command['exit_code'] != 0 for command in power['commands']):
              raise RuntimeError('Power controller execution incomplete')
          for command in power['commands']:
              if hashlib.sha256(Path(command['log']).read_bytes()).hexdigest() != command['log_sha256']:
                  raise RuntimeError('Power controller log changed')
          for path, digest in ((Path('build/silicon/ci-power/obj/VPowerControl'), power['compiled_binary_sha256']),
                               (Path('build/silicon/ci-power/lemma_silicon_binding.sv'), power['generated_binding_sha256'])):
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Power executable/binding changed')
          lanes = json.loads(Path('build/silicon/ci-bus-lanes/result.json').read_text())
          if lanes['status'] != 'PASS' or lanes['lane'] != 'bus-lanes' or lanes['source_commit'] != head:
              raise RuntimeError('Missing exact-candidate bus lane result')
          if lanes['observations'] != [
              'BUS actual CVW replicated SW QueueNum and MMIO byte/half/word/double lanes PASS',
              'PAPER registered MMIO AHB error retention single completion reset cancellation PASS',
              'ARB held CPU/DMA owner payload backpressure terminal errors reset quiescence PASS',
              'DMA narrow reads adjacent bytes write strobes ready backpressure CPU resume PASS'] or len(lanes['commands']) != 3 or len(lanes['source_inputs']) < 200:
              raise RuntimeError('Missing actual core/fabric lane observations')
          host = Path('build/silicon/ci-bus-lanes/host')
          for path, digest in ((host/'build.json', lanes['host_build_sha256']),
                               (host/'obj/lemma-rtl', lanes['host_binary_sha256'])):
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Compiled host adapter changed')
          import sys
          sys.path.insert(0, 'scripts')
          from check_silicon import host_deadline_options
          if lanes['host_deadline_options'] != host_deadline_options((host/'obj/lemma-rtl').resolve()):
              raise RuntimeError('Compiled deadline agreement was not reproduced')
          for path, digest in lanes['source_inputs'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != digest:
                  raise RuntimeError('Core/fabric lane input changed')
          for command in lanes['commands']:
              log = Path(command['log'])
              if command['exit_code'] != 0 or not log.stat().st_size or hashlib.sha256(log.read_bytes()).hexdigest() != command['log_sha256']:
                  raise RuntimeError('Missing or changed bus lane command output')
          PY

      - name: Retain RTL device observations and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silicon-devices-rtl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/source.json
            build/silicon/ci-devices/
            build/silicon/ci-bus-lanes/
            build/silicon/ci-power/
            build/silicon/ci-product-reset-runtime/build.json
            build/silicon/ci-pen-uart-resync/
            build/ci/silicon-devices-rtl.log
            build/ci/silicon-bus-lanes-rtl.log
            build/ci/silicon-power-rtl.log
            build/ci/silicon-reset-runtime-build.log
            build/ci/silicon-pen-uart-resync.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  crypto-rv64:
    name: Public-development SHA/HMAC RV64 and authenticated ROM audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Execute genuine SHA/HMAC RV64 known answers
        run: |
          set -euo pipefail
          mkdir -p build/ci
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_crypto.py --work-dir build/boot/ci-crypto-rv64 \
            2>&1 | tee build/ci/crypto-rv64.log
      - name: Audit genuine authenticated development ROM and scratch admission
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            nix develop --no-write-lock-file --command \
              python3 scripts/build_development_auth_boot.py --public-development-key \
                --work-dir build/boot/ci-auth-rom \
            2>&1 | tee build/ci/development-auth-rom.log
          timeout --foreground --signal=TERM --kill-after=30s 2m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/boot/DevelopmentAuthentication.lean \
            2>&1 | tee build/ci/development-auth-layout.log
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          for path, expected in [('build/boot/ci-crypto-rv64/result.json','PASS_GENUINE_RV64_SHA256_HMAC_COMPONENT'),
                                 ('build/boot/ci-auth-rom/build.json','PASS_GENUINE_DEVELOPMENT_AUTH_ROM')]:
              report = json.loads(Path(path).read_text())
              if report['status'] != expected or report['source_commit'] != head or report['dirty_paths']:
                  raise RuntimeError('Missing exact clean-source cryptographic observation')
              for name, digest in report['source_inputs'].items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                      raise RuntimeError('Cryptographic source changed')
          if 'DEVELOPMENT_AUTH_LAYOUT:PASS' not in Path('build/ci/development-auth-layout.log').read_text():
              raise RuntimeError('Missing actual ROM scratch admission/disjointness result')
          PY
      - name: Retain cryptographic execution, ROM audits and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-rv64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/source.json
            build/boot/ci-crypto-rv64/
            build/boot/ci-auth-rom/
            build/ci/crypto-rv64.log
            build/ci/development-auth-rom.log
            build/ci/development-auth-layout.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6


  acceptance-summary:
    name: Aggregate required acceptance dispositions
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      - lemmasim-writing-rv64
      - metadata
      - kernel-managed-rv64
      - kernel-services-rv64
      - legacy-rv64
      - foundation-rv64
      - kernel-rv64
      - kernel-source-negatives-rv64
      - kernel-architecture-rv64
      - silicon-devices-rtl
      - crypto-rv64
    steps:
      - name: Require every designated claim, including jobs that were skipped
        env:
          REQUIRED_DISPOSITIONS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["REQUIRED_DISPOSITIONS"])
          expected = {"lemmasim-writing-rv64", "metadata", "kernel-managed-rv64",
                      "kernel-services-rv64", "legacy-rv64", "foundation-rv64", "kernel-rv64",
                      "kernel-source-negatives-rv64", "kernel-architecture-rv64",
                      "silicon-devices-rtl", "crypto-rv64"}
          if set(results) != expected:
              raise RuntimeError("Required acceptance job inventory is incomplete")
          dispositions = {name: value["result"] for name, value in sorted(results.items())}
          print(json.dumps(dispositions, indent=2))
          if any(value != "success" for value in dispositions.values()):
              raise RuntimeError("Required claim failed, was cancelled, unavailable or skipped")
          PY
