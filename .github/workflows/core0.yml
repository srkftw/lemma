name: Core0 freestanding RV64

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core0:
    name: Scaffold, host harness, and real RV64 slice
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run scaffold checks in the pinned environment
        run: |
          nix develop --command python3 scripts/check_scaffold.py
          nix develop --command python3 -m unittest discover -s tests/scaffold -v

      - name: Run Core0 host harness tests in the pinned environment
        run: nix develop --command python3 -m unittest discover -s tests/core0 -v

      - name: Build, audit, and execute the real Core0 RV64 slice
        run: timeout --foreground --signal=TERM --kill-after=30s 30m nix develop --command ./scripts/check-core0.sh --clean

      - name: Retain Core0 build and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/core0/
            docs/evidence/001-core0.md
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
