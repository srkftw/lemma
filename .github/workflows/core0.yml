name: Lemma pinned acceptance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR updates supersede only that PR. Every main/manual run keeps its own slot,
  # including pending runs (cancel-in-progress: false alone would not preserve them).
  group: core0-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lemmasim-writing-rv64:
    name: Task 004 real notebook O0/O2 writing and cold recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare logs
        run: mkdir -p build/ci

      - name: Build the separately pinned host hardware binding
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 50m \
            nix build --no-write-lock-file --file tooling/lemmasim/qemu.nix \
              --out-link build/lemmasim/ci-qemu \
            2>&1 | tee build/ci/lemmasim-host-build.log

      - name: Compile, audit and observe real O0/O2 guest ink and cold recovery
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 60m \
            nix develop --no-write-lock-file --command \
              ./scripts/check-lemmasim.sh --clean --lane writing --with-o0 \
                --qemu build/lemmasim/ci-qemu/bin/qemu-system-riscv64 \
                --work-dir build/lemmasim/ci-writing --deadline 3500 \
            2>&1 | tee build/ci/lemmasim-writing.log

      - name: Require exact-candidate observations rather than a scoped empty pass
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('build/lemmasim/ci-writing')
          value = json.loads((root / 'result.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if value['status'] != 'PASS' or value['source']['commit'] != head or not value['source']['clean']:
              raise RuntimeError('Missing exact-candidate writing evidence')
          if value['lane'] != 'writing' or not value['with_o0'] or len(value['cases']) != 2:
              raise RuntimeError('Missing actual O0/O2 writing and cold recovery')
          for case in value['cases']:
              observed = json.loads(Path(case['observation']).read_text())
              cold = json.loads(Path(case['cold_observation']).read_text())
              if observed['status'] != 'PASS' or observed['retained_unique_raw_samples'] != 50 or cold['status'] != 'PASS':
                  raise RuntimeError('Missing genuine ink/committed-byte/pixel observations')
          PY

      - name: Retain notebook and hardware observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lemmasim-writing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/source.json
            build/lemmasim/ci-writing/
            build/kernel/ci-writing-*/
            build/ci/lemmasim-*.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  metadata:
    name: Metadata and host-only suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare host-suite logs
        run: mkdir -p build/ci/metadata

      - name: Run CI orchestration suite
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 5m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/ci -v \
            2>&1 | tee build/ci/metadata/ci-unittest.log

      - name: Run scaffold metadata checker
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 5m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_scaffold.py \
            2>&1 | tee build/ci/metadata/check-scaffold.log

      - name: Run scaffold unit suite
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/scaffold -v \
            2>&1 | tee build/ci/metadata/scaffold-unittest.log

      - name: Run Core0 host-harness suite
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/core0 -v \
            2>&1 | tee build/ci/metadata/core0-host-unittest.log

      - name: Build Lean host artifacts for foundation tests
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 20m \
            nix develop --no-write-lock-file --command \
              lake build Lemma Lemma.Platform.LemmaSim.NotebookKernel \
                Lemma.Applications.Notebook \
                Lemma.Services.Store.ServerRecoveryAwait \
                Lemma.Compiler.KernelExport \
                Lemma.User.Runtime.Arena Lemma.Mathematics.OwnedSubmission \
                Lemma.Courses.Arithmetic Lemma.Courses.Package \
                Lemma.Courses.PackageInstaller \
                Lemma.Services.Arithmetic.Server Lemma.Services.Arithmetic.Client \
                Lemma.Services.Arithmetic.ClientV2 \
            2>&1 | tee build/ci/metadata/lake-build.log

      - name: Run foundation host-harness suite
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 20m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/foundation -v \
            2>&1 | tee build/ci/metadata/foundation-host-unittest.log

      - name: Check bounded product recovery transport
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 2m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/boot -v \
            2>&1 | tee build/ci/metadata/boot-host-unittest.log

      - name: Observe checked memory copying and power authority in Lean
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/UserCopyScans.lean \
            2>&1 | tee build/ci/metadata/user-copy-scans.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/LoaderCopy.lean \
            2>&1 | tee build/ci/metadata/loader-copy.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/ink/CourseSave.lean \
            2>&1 | tee build/ci/metadata/course-save.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/courses/IngressIdle.lean \
            2>&1 | tee build/ci/metadata/course-ingress-idle.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/lemmasim/PowerControl.lean \
            2>&1 | tee build/ci/metadata/power-authority.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/lemmasim/PowerObjectBudget.lean \
            2>&1 | tee build/ci/metadata/power-object-budget.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_power_compiler.py \
                --work-dir build/lemmasim/compiler-power-ci \
            2>&1 | tee build/ci/metadata/power-compiler.log

      - name: Check indexed frames, exact mathematics and external backing outcomes
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/FramesScans.lean \
            2>&1 | tee build/ci/metadata/frame-index.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/kernel/OwnedTablePrefix.lean \
            2>&1 | tee build/ci/metadata/owned-table-prefix.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/mathematics/ExactMath.lean \
            2>&1 | tee build/ci/metadata/exact-mathematics.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/runtime/OwnedArena.lean \
            2>&1 | tee build/ci/metadata/owned-arena.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/mathematics/ArithmeticIPC.lean \
            2>&1 | tee build/ci/metadata/arithmetic-ipc.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/ObjectsV3.lean \
            2>&1 | tee build/ci/metadata/arithmetic-object-budget.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/PoolReadRefinement.lean \
            2>&1 | tee build/ci/metadata/pool-read-refinement.log
          grep -Fq 'POOL_READ_REFINEMENT:PASS 48 production Action boundary/error observations' \
            build/ci/metadata/pool-read-refinement.log
          timeout --foreground --signal=TERM --kill-after=10s 2m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/lemmasim -p test_backing_io.py -v \
            2>&1 | tee build/ci/metadata/backing-io.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/lemmasim -p test_companion_peer.py -v \
            2>&1 | tee build/ci/metadata/companion-peer.log

      - name: Qualify IPC authority and managed notebook lowering
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/tests/kernel
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 \
                -o .lake/build/lib/lean/tests/kernel/IPCCallBaseReuse.olean \
                tests/kernel/IPCCallBaseReuse.lean \
            2>&1 | tee build/ci/metadata/descriptor-model.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 tests/kernel/DescriptorDirectLoads.lean \
            2>&1 | tee build/ci/metadata/descriptor-direct-loads.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/courses/NotebookPackage.lean \
            2>&1 | tee build/ci/metadata/notebook-package-state-layout.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/courses/WorkspaceCodec.lean \
            2>&1 | tee build/ci/metadata/course-workspace-codec.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/ink/NotebookRetryWorkspacePolicy.lean \
            2>&1 | tee build/ci/metadata/workspace-retry-shapes.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/ink/NotebookClosureRecoverable.lean \
            2>&1 | tee build/ci/metadata/workspace-reconciliation-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/courses/Render.lean \
            2>&1 | tee build/ci/metadata/course-render-delta.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/course/PackedRender.lean \
            2>&1 | tee build/ci/metadata/course-packed-words.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/kernel/ManagedNotebookDeployment.lean \
            2>&1 | tee build/ci/metadata/managed-notebook-deployment.log
          test ! -e build/kernel/ci-user-word-inline
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEMMA_WORD_INLINE_FIXTURE_DIR=build/kernel/ci-user-word-inline \
                lake env lean tests/kernel/UserWordInline.lean \
            2>&1 | tee build/ci/metadata/user-word-inline.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean tests/mathematics/ExecutionIdentity.lean \
            2>&1 | tee build/ci/metadata/arithmetic-execution-identity.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_kernel_ipc_poll_borrow.py \
                --work-dir build/kernel/ci-ipc-poll-borrow --timeout 180 \
            2>&1 | tee build/ci/metadata/ipc-poll-borrow.log

      - name: Qualify exact aligned course controls
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            nix develop --no-write-lock-file --command \
              python3 scripts/check_control_render.py \
                --work-dir build/courses/ci-control-render \
            2>&1 | tee build/ci/metadata/control-render.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 --run tests/courses/NumberEntry.lean \
            2>&1 | tee build/ci/metadata/number-entry-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              python3 scripts/number_pad_reference.py \
                --output-dir build/courses/ci-number-pad/reference \
            2>&1 | tee build/ci/metadata/number-pad-reference.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEMMA_NUMBER_PAD_REFERENCE=build/courses/ci-number-pad/reference \
                lake env lean -j2 --run tests/courses/NumberPad.lean \
            2>&1 | tee build/ci/metadata/number-pad-actions.log

      - name: Check joined companion number-entry recovery Actions
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 --run tests/courses/CompanionNumberEntry.lean \
            2>&1 | tee build/ci/metadata/companion-number-entry-actions.log
          grep -F 'COMPANION_NUMBER_ENTRY16:PASS' build/ci/metadata/companion-number-entry-actions.log

      - name: Check read-only course location recovery from source history
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake build Lemma.Courses.PackagePublishMain Lemma.Courses.BrowseHistory \
            2>&1 | tee build/ci/metadata/browse-history-build.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 --run Lemma/Courses/PackagePublishMain.lean \
                --output-dir build/courses/ci-browse-history/package \
            2>&1 | tee build/ci/metadata/browse-history-package.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEMMA_COURSE_PACKAGE_FILE=build/courses/ci-browse-history/package/arithmetic.lcp \
                lake env lean -j2 --run tests/courses/BrowseHistory.lean \
            2>&1 | tee build/ci/metadata/browse-history-actions.log
          grep -F 'BROWSE_HISTORY1:PASS' build/ci/metadata/browse-history-actions.log

      - name: Check joined companion reader recovery Actions and deployment
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean --run tests/ink/NotebookRetryReaderPolicy.lean \
            2>&1 | tee build/ci/metadata/reader-retry5-shapes.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                LEMMA_COURSE_PACKAGE_FILE=build/courses/ci-browse-history/package/arithmetic.lcp \
                lake env lean -j2 tests/courses/NotebookReaderRecovery.lean \
            2>&1 | tee build/ci/metadata/companion-reader-recovery5-actions.log
          grep -F 'READER_RECOVERY5_ACTIONS:PASS' build/ci/metadata/companion-reader-recovery5-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake env lean -j2 tests/courses/CompanionReaderDeployment.lean \
            2>&1 | tee build/ci/metadata/companion-reader-deployment19.log
          grep -F 'COMPANION_READER19_DEPLOYMENT:PASS' build/ci/metadata/companion-reader-deployment19.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake env lean -j2 tests/courses/ChooserReaderDeployment.lean \
            2>&1 | tee build/ci/metadata/chooser-reader-deployment20.log
          grep -F 'PASS closed Reader20 chooser and preserved Reader18/history17 deployment selection' build/ci/metadata/chooser-reader-deployment20.log

      - name: Check separate course reader Save and cancellation Actions
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                LEMMA_COURSE_PACKAGE_FILE=build/courses/ci-browse-history/package/arithmetic.lcp \
                lake env lean -j2 --run tests/courses/ReaderLocation.lean \
            2>&1 | tee build/ci/metadata/reader-location-actions.log
          grep -F 'READER_LOCATION1:PASS' build/ci/metadata/reader-location-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                LEMMA_COURSE_PACKAGE_FILE=build/courses/ci-browse-history/package/arithmetic.lcp \
                lake env lean -j2 tests/courses/NotebookReader.lean \
            2>&1 | tee build/ci/metadata/notebook-reader-actions.log
          grep -F 'PASS actual Notebook reader Save/poll/failure/authority/component Actions' build/ci/metadata/notebook-reader-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake env lean -j2 tests/courses/ReaderDeployment.lean \
            2>&1 | tee build/ci/metadata/reader-deployment-actions.log
          grep -F 'PASS closed Reader18 and preserved history17 deployment selection' build/ci/metadata/reader-deployment-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake env lean -j2 tests/courses/ProductReaderDeployment.lean \
            2>&1 | tee build/ci/metadata/product-reader-deployment-actions.log
          grep -F 'PRODUCT_COURSE_READER_DEPLOYMENT:PASS' build/ci/metadata/product-reader-deployment-actions.log
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              env LEAN_NUM_THREADS=2 LEAN_STACK_SIZE_KB=65536 \
                lake env lean -j2 tests/courses/RecoveryEntry2Deployment.lean \
            2>&1 | tee build/ci/metadata/recovery-entry2-deployment-actions.log
          grep -F 'RECOVERY_ENTRY2_DEPLOYMENT:PASS' build/ci/metadata/recovery-entry2-deployment-actions.log

      - name: Check actual aligned arithmetic presentation Actions
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 --run tests/courses/ArithmeticAligned.lean \
            2>&1 | tee build/ci/metadata/arithmetic-aligned-actions.log

      - name: Compare compiler name sets with historical relations
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 2m \
            nix develop --no-write-lock-file --command \
              lake env lean -j2 --run tests/core0/LLVMNameSets.lean \
            2>&1 | tee build/ci/metadata/llvm-name-sets.log

      - name: Produce the ordinary kernel host prerequisite once
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 15m \
            nix develop --no-write-lock-file --command \
              nix shell --no-write-lock-file --inputs-from . nixpkgs#git --command \
              python3 scripts/host_prerequisites.py produce \
                --output-dir build/ci/metadata/kernel-host-prerequisite --timeout 850 \
            2>&1 | tee build/ci/metadata/kernel-host-unittest.log

      - name: Share the exact successful kernel host receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-host-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/metadata/kernel-host-prerequisite/receipt.json
            build/ci/metadata/kernel-host-prerequisite/kernel-host.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Run action-cache and resume-status failure tests
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            nix develop --no-write-lock-file --command \
              nix shell --no-write-lock-file --inputs-from . nixpkgs#git --command \
              python3 -m unittest discover -s tests/cache -v \
            2>&1 | tee build/ci/metadata/cache-host-unittest.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          value = Path("build/ci/metadata/cache-host-unittest.log").read_text()
          count = re.search(r"Ran ([0-9]+) tests?", value)
          if not count or int(count[1]) <= 0 or not re.search(r"^OK$", value, re.M):
              raise RuntimeError("Cache/status host suite is missing, empty or failing")
          PY

      - name: Run silicon host orchestration and observation suite
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 10m \
            nix develop --no-write-lock-file --command \
              python3 -m unittest discover -s tests/silicon -v \
            2>&1 | tee build/ci/metadata/silicon-host-unittest.log
