  kernel-rv64:
    name: Task 003 implemented Gates A-E RV64 acceptance
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the exact CI source and event
        run: python3 scripts/ci_source.py --output build/ci/source.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download this run's exact ordinary host prerequisite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kernel-host-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/metadata/kernel-host-prerequisite

      - name: Prepare Task 003 log directory
        run: mkdir -p build/ci

      - name: Build, audit and execute the clean implemented kernel prefix
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=30s 40m \
            nix develop --no-write-lock-file --command \
              nix shell --no-write-lock-file --inputs-from . nixpkgs#git --command \
              python3 scripts/check_kernel.py \
                --work-dir build/kernel/ci-prefix \
                --host-prerequisite build/ci/metadata/kernel-host-prerequisite/receipt.json \
                --clean \
                --jobs 2 \
                --timeout 300 \
                --qemu-timeout 90 \
                --deadline 2400 \
            2>&1 | tee build/ci/kernel-rv64.log

      - name: Require complete Task 003 acceptance evidence
        run: |
          set -euo pipefail
          nix develop --no-write-lock-file --command \
            nix shell --no-write-lock-file --inputs-from . nixpkgs#git --command python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from build_kernel import source_inputs
          from check_kernel import acceptance_inputs, matrix, source_identity, validate_row_result, validate_session
          from check_kernel_syscall import DEFAULT_SEEDS
          def require(condition):
              if not condition:
                  raise RuntimeError("Missing or changed mandatory Task 003 evidence")
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          result = Path("build/kernel/ci-prefix/result.json")
          value = json.loads(result.read_text())
          lean = json.loads(Path("tooling/toolchain-lock.json").read_text())["tools"]["lean"]
          require(value["status"] == "PASS" and value["source"]["clean"] is True)
          require(value["required_gate_prefix"] == "A-E" and value["highest_exercised_gate"] == "E")
          require(len(value["images"]) == 20 and len(value["observations"]) == 24)
          require(value["qemu_sessions"] == 28 and value["syscall_user_instances"] == 6)
          require(value["jobs"] == 2 and len(value["matrix_rows"]) == 20)
          require([row["index"] for row in value["matrix_rows"]] == list(range(20)))
          require(value["source"] == source_identity(Path.cwd()))
          require(value["source_inputs"] == source_inputs(Path.cwd()))
          require(value["acceptance_inputs"] == acceptance_inputs(Path.cwd()))
          for row in value["matrix_rows"]:
              request_path = Path(row["request"])
              supervisor_path = Path(row["supervisor"])
              require(digest(request_path) == row["request_sha256"] and digest(supervisor_path) == row["supervisor_sha256"])
              require(digest(Path(row["result"])) == row["result_sha256"] and row["cleanup_complete"] is True)
              request = json.loads(request_path.read_text())
              require(request["source"] == value["source"] and request["source_inputs"] == value["source_inputs"])
              require(request["acceptance_inputs"] == value["acceptance_inputs"] and request["slot"] in (0, 1))
              admitted = validate_row_result(Path.cwd(), Path("build/kernel/ci-prefix").resolve(), request,
                                            request_path.resolve(), row["request_sha256"], supervisor_path.resolve())
              require(admitted["supervision"] == row)
          from host_prerequisites import validate as validate_host_prerequisite
          admission = validate_host_prerequisite(Path.cwd(), Path("build/kernel/ci-prefix/host-prerequisite/receipt.json"))
          shared = [row for row in value["invocations"] if row.get("route") == "lemma-kernel-host-prerequisite/1"]
          require(len(shared) == 1 and shared[0] == {"label": "kernel-host", **admission})
          require(value["host_tests"] == admission["test_count"] and admission["test_count"] > 0)
          require([(row["configuration"], row["stage"], row["optimization"]) for row in value["images"]] == list(matrix()))
          expected_observations = []
          for cfg, stage, opt in matrix():
              roles = (["bootinfo"] if cfg == "normal" and stage == "bootstrap-m" else
                       ["user"] if cfg == "normal" else
                       ["frames", "address-space", "loader"] if cfg == "frames-development" else
                       ["machine-origin"] if cfg == "machine-origin-development" else
                       ["syscall"] if cfg == "user-syscall-development" else ["isolation"])
              expected_observations.extend((cfg, stage, opt, role) for role in roles)
          require([(r["configuration"], r["stage"], r["optimization"], r["role"]) for r in value["observations"]] == expected_observations)
          require(sum(r["qemu_sessions"] for r in value["observations"]) == 28)
          require(sum(r["syscall_user_instances"] for r in value["observations"]) == 6)
          images = {(row["configuration"], row["stage"], row["optimization"]): Path(row["image"]).resolve() for row in value["images"]}
          for row in value["images"]:
              image = Path(row["image"])
              require(image.is_file() and image.stat().st_size > 0 and digest(image) == row["sha256"])
              audit, provenance = image.parent / "audit.json", image.parent / "provenance.json"
              require(digest(audit) == row["audit_sha256"] and digest(provenance) == row["provenance_sha256"])
              audited = json.loads(audit.read_text())
              require(audited["status"] == "PASS" and audited["dirty_paths"] == [])
              require(audited["source_commit"] == value["source"]["commit"] and audited["image_sha256"] == row["sha256"])
              require(tuple(audited[k] for k in ("configuration", "stage", "optimization")) == tuple(row[k] for k in ("configuration", "stage", "optimization")))
              recorded = json.loads(provenance.read_text())
              require(recorded["source_commit"] == value["source"]["commit"] and recorded["dirty_paths"] == [])
              require(recorded["source_inputs"] == value["source_inputs"])
              require(tuple(recorded[k] for k in ("configuration", "stage", "optimization")) == tuple(row[k] for k in ("configuration", "stage", "optimization")))
              realized = recorded["lean_source_realization"]
              require(realized["source_path"] == lean["source_path"] and realized["revision"] == lean["revision"])
              require(realized["narHash"] == lean["source_sha256"] and realized["narSize"] == lean["source_nar_size"])
          for row in value["observations"]:
              observed = Path(row["result"])
              result = json.loads(observed.read_text())
              require(digest(observed) == row["sha256"] and result["status"] == "PASS")
              image = images[(row["configuration"], row["stage"], row["optimization"])]
              require(row["status"] == "PASS" and type(row["qemu_sessions"]) is int and row["qemu_sessions"] == (3 if row["role"] == "bootinfo" else 1))
              require(type(row["syscall_user_instances"]) is int and row["syscall_user_instances"] == (3 if row["role"] == "syscall" else 0))
              if row["role"] == "syscall":
                  actual = result["observed"]
                  require(actual["protocol"] == "user-E-syscalls-v1" and actual["fresh_user_runs"] == 3)
                  require([case["runtime_seed"] for case in actual["cases"]] == list(DEFAULT_SEEDS))
              if row["role"] == "bootinfo":
                  require([child["kind"] for child in result["cases"]] == ["ordinary", "reserved-pool", "root-cells"])
                  for child in result["cases"]:
                      require(digest(Path(child["result"])) == child["result_sha256"])
                      validate_session(Path(child["result"]), image)
              else:
                  validate_session(observed.resolve(), image, machine_origin=row["role"] == "machine-origin")
          PY

      - name: Retain Task 003 prefix evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-A-E-rv64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/source.json
            build/kernel/ci-prefix/
            build/ci/kernel-rv64.log
            docs/evidence/003-*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

